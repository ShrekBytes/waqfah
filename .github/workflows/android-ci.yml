name: Android CI

# Runner and action pinning notes:
#
# - `ubuntu-24.04` is pinned rather than `ubuntu-latest`, which migrates to
#   Ubuntu 26 on 2026-10-19. The instrumented job depends on a KVM workaround
#   tuned to this image; move it deliberately, after testing, not by surprise.
# - `gradle/actions/setup-gradle` stays on v5 and must NOT go to v6. v6 extracts
#   the caching component into `gradle-actions-caching`, which is proprietary and
#   not MIT-licensed. v5's only change over v4 is the Node 24 runtime.
# - The other actions are on their current majors, whose only breaking change
#   over v4 is the Node 24 runtime.
# - The JDK is pinned to 21 to match the Gradle daemon criteria in
#   `gradle/gradle-daemon-jvm.properties`. Mismatching the two makes Gradle
#   download a second JDK just to run the daemon, and 21 is also what the
#   F-Droid buildserver provides, so CI exercises the same JVM it will.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Lint and unit tests run against `play` only: the two flavours differ by
      # nothing but the application ID suffix, so the compiled code is identical.
      - name: Lint
        run: ./gradlew :app:lintPlayDebug --console=plain

      - name: Unit tests
        run: ./gradlew :app:testPlayDebugUnitTest --console=plain

      - name: Assemble debug APKs
        run: ./gradlew :app:assemblePlayDebug :app:assembleFdroidDebug --console=plain

      # Proves the R8/resource-shrinking release path compiles for both store
      # channels; an R8 failure would otherwise surface only at release time.
      - name: Assemble release APKs (R8 check)
        run: ./gradlew :app:assemblePlayRelease :app:assembleFdroidRelease --console=plain

      # The Play upload artifact is an AAB, not an APK, and until now nothing
      # built it — the bundle path could have broken without CI noticing.
      # CI has no keystore, so this proves the bundle compiles and packages but
      # says nothing about the signature: with no signing config the task emits
      # an unsigned `app-play-release.aab` (note: no `-unsigned` suffix, unlike
      # the APK). See docs/play-submission.md.
      - name: Bundle Play release (AAB check)
        run: ./gradlew :app:bundlePlayRelease --console=plain

      - name: Upload play debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-play-debug
          path: app/build/outputs/apk/play/debug/app-play-debug.apk

  # The androidTest suites (Room migration safety net, download gate, package
  # policy, corruption heuristic, repository contracts, and the reading card's
  # TalkBack announcements) run nowhere else — see
  # docs/audits/2026-09-06-health.md §5, recommendation 3. Deliberately no count
  # here: it is wrong the moment a suite is added, and nothing flags it.
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # github-hosted ubuntu-24.04 runners periodically boot without KVM access
      # for the runner user, leaving the emulator in software rendering that
      # cannot finish booting within the timeout (2026-09-07: ProbeKVM
      # permission errors + adb exit 1 until the 600s boot timeout, twice).
      # The udev rule grants access immediately — no re-login needed.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 36 is pinned because that is what this job was last verified
      # against — not because a 37 image is missing. `android-37.0;google_apis;
      # x86_64` has been published since Android 17 went stable on 2026-06-16.
      # targetSdk is already 37, so bumping this to 37.0 is due; do it as its
      # own change with a green run behind it, since the KVM workaround above
      # is tuned to this image and boot behaviour is the fragile part.
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedPlayDebugAndroidTest --console=plain

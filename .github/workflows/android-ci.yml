name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # Proves the R8/resource-shrinking release path compiles; an R8 failure
      # would otherwise surface only at release time.
      - name: Assemble release APK (R8 check)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

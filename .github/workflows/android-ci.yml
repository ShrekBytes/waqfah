name: Android CI

# Runner and action pinning notes:
#
# - `ubuntu-24.04` is pinned rather than `ubuntu-latest`, which migrates to
#   Ubuntu 26 on 2026-10-19. The instrumented job depends on a KVM workaround
#   tuned to this image; move it deliberately, after testing, not by surprise.
# - `gradle/actions/setup-gradle` stays on v5 and must NOT go to v6. v6 extracts
#   the caching component into `gradle-actions-caching`, which is proprietary and
#   not MIT-licensed. v5's only change over v4 is the Node 24 runtime.
# - The other actions are on their current majors, whose only breaking change
#   over v4 is the Node 24 runtime.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Lint and unit tests run against `play` only: the two flavours differ by
      # nothing but the application ID suffix, so the compiled code is identical.
      - name: Lint
        run: ./gradlew :app:lintPlayDebug --console=plain

      - name: Unit tests
        run: ./gradlew :app:testPlayDebugUnitTest --console=plain

      - name: Assemble debug APKs
        run: ./gradlew :app:assemblePlayDebug :app:assembleFdroidDebug --console=plain

      # Proves the R8/resource-shrinking release path compiles for both store
      # channels; an R8 failure would otherwise surface only at release time.
      - name: Assemble release APKs (R8 check)
        run: ./gradlew :app:assemblePlayRelease :app:assembleFdroidRelease --console=plain

      - name: Upload play debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-play-debug
          path: app/build/outputs/apk/play/debug/app-play-debug.apk

  # The five androidTest suites (Room migration safety net, download gate,
  # package policy, corruption heuristic, repository contracts) run nowhere
  # else — see docs/audits/2026-09-06-health.md §5, recommendation 3.
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # github-hosted ubuntu-24.04 runners periodically boot without KVM access
      # for the runner user, leaving the emulator in software rendering that
      # cannot finish booting within the timeout (2026-09-07: ProbeKVM
      # permission errors + adb exit 1 until the 600s boot timeout, twice).
      # The udev rule grants access immediately — no re-login needed.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Newest stable system image (no API 37 image is published yet); bump
      # the pin deliberately when targetSdk bumps.
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew :app:connectedPlayDebugAndroidTest --console=plain

<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Waqfah icon: an open Quran whose parted pages form a subtle pause mark.
       Colors match the app's Light palette: paper #F6F3EC, sage accent #71835F,
       soft sage #E3E8DA, ink #2A2823. -->

  <!-- Paper background -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#F6F3EC"/>

  <!-- Soft sage plate behind the mark -->
  <circle cx="256" cy="250" r="164" fill="#E3E8DA"/>

  <!-- Left page (its straight inner edge doubles as half of the pause mark) -->
  <path
    d="M 238 158
       C 213 137 173 127 133 131
       L 133 331
       C 173 327 213 337 238 358
       Z"
    fill="#71835F"
    stroke="#71835F"
    stroke-width="20"
    stroke-linejoin="round"/>

  <!-- Right page (mirrored) -->
  <path
    d="M 274 158
       C 299 137 339 127 379 131
       L 379 331
       C 339 327 299 337 274 358
       Z"
    fill="#71835F"
    stroke="#71835F"
    stroke-width="20"
    stroke-linejoin="round"/>
</svg>
